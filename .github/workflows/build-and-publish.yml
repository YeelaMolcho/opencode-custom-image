name: Build and Publish OpenCode Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER_LC }}/opencode-custom-image:latest \
            -t ghcr.io/${{ env.OWNER_LC }}/opencode-custom-image:1.17.7 \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/opencode-custom-image:latest
          docker push ghcr.io/${{ env.OWNER_LC }}/opencode-custom-image:1.17.7

      - name: Save image
        run: |
          docker save \
            ghcr.io/${{ env.OWNER_LC }}/opencode-custom-image:1.17.7 \
            | gzip > opencode-custom-1.17.7.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: opencode-custom-1.17.7
          path: opencode-custom-1.17.7.tar.gz
